# Persona — nginx reverse proxy
#
#   sudo cp deploy/nginx-persona.conf /etc/nginx/sites-available/persona
#   sudo ln -s /etc/nginx/sites-available/persona /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Node process serves both the API and the built frontend, including the
# single-page fallback, so nginx only needs to pass traffic through.

upstream persona_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name epersona.pl www.epersona.pl;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name epersona.pl www.epersona.pl;

    # certbot fills these in; see deploy/README.md
    ssl_certificate     /etc/letsencrypt/live/epersona.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epersona.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Visitors upload briefs and photos; the app caps files at 10 MB.
    client_max_body_size 12m;

    access_log /var/log/nginx/persona.access.log;
    error_log  /var/log/nginx/persona.error.log;

    # Advisor replies are streamed as server-sent events. Buffering here would
    # hold the whole answer back and make the chat look frozen.
    location /api/anthropic/ {
        proxy_pass http://persona_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # The embed snippet on a client's site loads this cross-origin.
    location = /widget.js {
        proxy_pass http://persona_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        proxy_pass http://persona_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
