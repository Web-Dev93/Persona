server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10M;

    # Panel administracyjny nie ma własnej autoryzacji — patrz DEPLOY.md.
    # Aby ograniczyć dostęp, odkomentuj blok poniżej i utwórz plik haseł:
    #   apt-get install -y apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd admin
    #
    # location ~ ^/(admin|api/admin) {
    #     auth_basic "Panel administracyjny";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Strumieniowanie odpowiedzi czatu (SSE) — buforowanie musi być wyłączone,
    # inaczej wiadomości konsultanta pojawiają się dopiero po zakończeniu odpowiedzi.
    location /api/anthropic/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
