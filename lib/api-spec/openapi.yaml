openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: anthropic
  - name: leads
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"

  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /leads/session/{token}:
    get:
      operationId: getSessionByToken
      tags: [leads]
      summary: Get conversation by session token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /leads/{id}/complete:
    post:
      operationId: completeLead
      tags: [leads]
      summary: Mark lead as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCompleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/leads:
    get:
      operationId: listAdminLeads
      tags: [admin]
      summary: List all leads
      parameters:
        - name: personaId
          in: query
          required: false
          schema:
            type: integer
        - name: personaTypeId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadSummary"

  /admin/leads/{id}:
    get:
      operationId: getAdminLead
      tags: [admin]
      summary: Get lead detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminLead
      tags: [admin]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/leads/{id}/summarize:
    post:
      operationId: summarizeLead
      tags: [admin]
      summary: Generate AI summary of lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSummarizeResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get admin settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update admin settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /admin/persona-types:
    get:
      operationId: listPersonaTypes
      tags: [admin]
      summary: List all persona types with their personas
      responses:
        "200":
          description: List of persona types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonaTypeWithPersonas"
    post:
      operationId: createPersonaType
      tags: [admin]
      summary: Create a persona type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaTypeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaType"

  /admin/persona-types/{id}:
    get:
      operationId: getPersonaType
      tags: [admin]
      summary: Get a persona type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Persona type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaType"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updatePersonaType
      tags: [admin]
      summary: Update a persona type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaTypeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaType"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePersonaType
      tags: [admin]
      summary: Delete a persona type and all its personas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /personas/by-slug/{slug}:
    get:
      operationId: getPersonaBySlug
      tags: [admin]
      summary: Get persona by slug (public, used by chat page)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/personas:
    get:
      operationId: listPersonas
      tags: [admin]
      summary: List all personas
      responses:
        "200":
          description: List of personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Persona"
    post:
      operationId: createPersona
      tags: [admin]
      summary: Create a persona within a type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"

  /admin/personas/active:
    get:
      operationId: getActivePersona
      tags: [admin]
      summary: Get the currently active persona (with effective style)
      responses:
        "200":
          description: Active persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: No active persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/personas/{id}:
    get:
      operationId: getPersona
      tags: [admin]
      summary: Get a persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updatePersona
      tags: [admin]
      summary: Update a persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePersona
      tags: [admin]
      summary: Delete a persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/personas/{id}/activate:
    post:
      operationId: activatePersona
      tags: [admin]
      summary: Set a persona as active
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activated persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /leads/{id}/contact:
    post:
      operationId: saveLeadContact
      tags: [leads]
      summary: Save contact details supplied by the visitor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInfoInput"
      responses:
        "200":
          description: Contact saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSaveResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /leads/{id}/attachments:
    get:
      operationId: listLeadAttachments
      tags: [leads]
      summary: List files attached to a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"

  /admin/leads/{id}/resend:
    post:
      operationId: resendLead
      tags: [admin]
      summary: Re-send a captured lead to e-mail and webhook targets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDeliveryResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/webhook-test:
    post:
      operationId: testAdminWebhook
      tags: [admin]
      summary: Send a sample payload to the configured webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookTestInput"
      responses:
        "200":
          description: Webhook accepted the payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleResult"
        "400":
          description: No webhook configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Webhook rejected the payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [admin]
      summary: Conversation analytics overview
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /admin/analytics/ai-report:
    post:
      operationId: generateAnalyticsReport
      tags: [admin]
      summary: Generate an AI report over collected conversations
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReport"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/settings:
    get:
      operationId: getPublicSettings
      tags: [public]
      summary: Settings exposed to visitors and the demo simulator
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /widget/config/{slug}:
    get:
      operationId: getWidgetConfig
      tags: [public]
      summary: Runtime configuration for the embeddable widget
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Widget configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfig"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /leads/upload:
    post:
      operationId: uploadLeadAttachment
      tags: [leads]
      summary: Attach a file to a conversation
      requestBody:
        required: true
        content:
          multipart/form-data: {}
      responses:
        "201":
          description: File stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUploadResult"
        "400":
          description: Missing or rejected file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/photo-upload:
    post:
      operationId: uploadConsultantPhoto
      tags: [admin]
      summary: Upload the global consultant photo
      requestBody:
        required: true
        content:
          multipart/form-data: {}
      responses:
        "200":
          description: Photo stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadResult"
        "400":
          description: Missing file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/persona-photo-upload:
    post:
      operationId: uploadPersonaPhoto
      tags: [admin]
      summary: Upload a photo for a single persona
      requestBody:
        required: true
        content:
          multipart/form-data: {}
      responses:
        "200":
          description: Photo stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadResult"
        "400":
          description: Missing file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    AttachmentUploadResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: integer
        fileName:
          type: string
        fileUrl:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
      required: [success, message, id, fileName, fileUrl, mimeType, sizeBytes]

    PhotoUploadResult:
      type: object
      properties:
        photoUrl:
          type: string
      required: [photoUrl]

    ContactInfo:
      type: object
      properties:
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        company:
          type: ["string", "null"]

    ContactInfoInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        company:
          type: string

    ContactSaveResult:
      type: object
      properties:
        success:
          type: boolean
        contactInfo:
          $ref: "#/components/schemas/ContactInfo"
      required: [success, contactInfo]

    Attachment:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: ["integer", "null"]
        fileName:
          type: string
        fileUrl:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, fileName, fileUrl, mimeType, sizeBytes, createdAt]

    LeadWithConversation:
      type: object
      properties:
        lead:
          $ref: "#/components/schemas/LeadDetail"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required: [lead, messages]

    LeadDeliveryResult:
      type: object
      properties:
        success:
          type: boolean
        emailSent:
          type: boolean
        webhookSent:
          type: boolean
        errors:
          type: array
          items:
            type: string
      required: [success, emailSent, webhookSent, errors]

    SimpleResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    WebhookTestInput:
      type: object
      properties:
        webhookUrl:
          type: string

    PublicSettings:
      type: object
      properties:
        salesEnabled:
          type: boolean
        timerMode:
          type: string
        timerHours:
          type: integer
        consultantName:
          type: string
        companyName:
          type: string
      required: [salesEnabled, timerMode, timerHours, consultantName, companyName]

    WidgetConfig:
      type: object
      properties:
        slug:
          type: ["string", "null"]
        name:
          type: string
        title:
          type: string
        photoUrl:
          type: ["string", "null"]
        style:
          type: string
        companyName:
          type: string
        welcomeText:
          type: string
      required: [name, title, style, companyName, welcomeText]

    CapturedContact:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        conversationId:
          type: integer
        date:
          type: string
          format: date-time
      required: [type, value, conversationId, date]

    KeywordCount:
      type: object
      properties:
        keyword:
          type: string
        count:
          type: integer
      required: [keyword, count]

    IntentCounts:
      type: object
      properties:
        pricing:
          type: integer
        timeline:
          type: integer
        technical:
          type: integer
        appointment:
          type: integer
        general:
          type: integer
      required: [pricing, timeline, technical, appointment, general]

    ConversationBreakdown:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        userMessageCount:
          type: integer
        hasLeadContact:
          type: boolean
        summary:
          type: ["string", "null"]
        lastMessage:
          type: string
      required: [id, title, createdAt, messageCount, userMessageCount, hasLeadContact, lastMessage]

    AnalyticsOverview:
      type: object
      properties:
        totalConversations:
          type: integer
        totalUserMessages:
          type: integer
        totalAssistantMessages:
          type: integer
        capturedContactsCount:
          type: integer
        capturedContacts:
          type: array
          items:
            $ref: "#/components/schemas/CapturedContact"
        intentCounts:
          $ref: "#/components/schemas/IntentCounts"
        topKeywords:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCount"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationBreakdown"
      required:
        [
          totalConversations,
          totalUserMessages,
          totalAssistantMessages,
          capturedContactsCount,
          capturedContacts,
          intentCounts,
          topKeywords,
          conversations,
        ]

    AnalyticsReport:
      type: object
      properties:
        report:
          type: string
        generatedAt:
          type: string
          format: date-time
      required: [report, generatedAt]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        sessionToken:
          type: string
        emailSent:
          type: boolean
        completed:
          type: boolean
        summary:
          type: ["string", "null"]
        personaId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, title, sessionToken, emailSent, completed, createdAt]

    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]

    AnthropicConversationWithMessages:
