openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: anthropic
  - name: leads
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"

  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /leads/session/{token}:
    get:
      operationId: getSessionByToken
      tags: [leads]
      summary: Get conversation by session token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /leads/{id}/complete:
    post:
      operationId: completeLead
      tags: [leads]
      summary: Mark lead as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCompleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/leads:
    get:
      operationId: listAdminLeads
      tags: [admin]
      summary: List all leads
      parameters:
        - name: personaId
          in: query
          required: false
          schema:
            type: integer
        - name: personaTypeId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadSummary"

  /admin/leads/{id}:
    get:
      operationId: getAdminLead
      tags: [admin]
      summary: Get lead detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminLead
      tags: [admin]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/leads/{id}/summarize:
    post:
      operationId: summarizeLead
      tags: [admin]
      summary: Generate AI summary of lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSummarizeResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get admin settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update admin settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /admin/persona-types:
    get:
      operationId: listPersonaTypes
      tags: [admin]
      summary: List all persona types with their personas
      responses:
        "200":
          description: List of persona types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonaTypeWithPersonas"
    post:
      operationId: createPersonaType
      tags: [admin]
      summary: Create a persona type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaTypeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaType"

  /admin/persona-types/{id}:
    get:
      operationId: getPersonaType
      tags: [admin]
      summary: Get a persona type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Persona type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaType"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updatePersonaType
      tags: [admin]
      summary: Update a persona type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaTypeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaType"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePersonaType
      tags: [admin]
      summary: Delete a persona type and all its personas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/personas:
    get:
      operationId: listPersonas
      tags: [admin]
      summary: List all personas
      responses:
        "200":
          description: List of personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Persona"
    post:
      operationId: createPersona
      tags: [admin]
      summary: Create a persona within a type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"

  /admin/personas/active:
    get:
      operationId: getActivePersona
      tags: [admin]
      summary: Get the currently active persona (with effective style)
      responses:
        "200":
          description: Active persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: No active persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/personas/{id}:
    get:
      operationId: getPersona
      tags: [admin]
      summary: Get a persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updatePersona
      tags: [admin]
      summary: Update a persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePersona
      tags: [admin]
      summary: Delete a persona
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/personas/{id}/activate:
    post:
      operationId: activatePersona
      tags: [admin]
      summary: Set a persona as active
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activated persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        sessionToken:
          type: string
        emailSent:
          type: boolean
        completed:
          type: boolean
        summary:
          type: ["string", "null"]
        personaId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, title, sessionToken, emailSent, completed, createdAt]

    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]

    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        sessionToken:
          type: string
        emailSent:
          type: boolean
        completed:
          type: boolean
        summary:
          type: ["string", "null"]
        personaId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required: [id, title, sessionToken, emailSent, completed, createdAt, messages]

    ConversationInput:
      type: object
      properties:
        title:
          type: string
        sessionToken:
          type: string
        personaId:
          type: ["integer", "null"]
      required: [title, sessionToken]

    MessageInput:
      type: object
      properties:
        content:
          type: string
      required: [content]

    LeadCompleteResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    LeadSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        sessionToken:
          type: string
        completed:
          type: boolean
        summary:
          type: ["string", "null"]
        messageCount:
          type: integer
        personaId:
          type: ["integer", "null"]
        personaName:
          type: ["string", "null"]
        personaTypeName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, title, sessionToken, completed, messageCount, createdAt]

    LeadDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        sessionToken:
          type: string
        completed:
          type: boolean
        summary:
          type: ["string", "null"]
        messageCount:
          type: integer
        personaId:
          type: ["integer", "null"]
        personaName:
          type: ["string", "null"]
        personaTypeName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required: [id, title, sessionToken, completed, messageCount, createdAt, messages]

    LeadSummarizeResult:
      type: object
      properties:
        summary:
          type: string
      required: [summary]

    AppSettings:
      type: object
      properties:
        systemPrompt:
          type: string
        consultantName:
          type: string
        consultantTitle:
          type: string
        consultantPhotoUrl:
          type: ["string", "null"]
      required: [systemPrompt, consultantName, consultantTitle]

    AppSettingsUpdate:
      type: object
      properties:
        systemPrompt:
          type: string
        consultantName:
          type: string
        consultantTitle:
          type: string
        consultantPhotoUrl:
          type: ["string", "null"]

    PersonaType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
        defaultStyle:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, slug, description, systemPrompt, defaultStyle, color, createdAt]

    PersonaTypeWithPersonas:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
        defaultStyle:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        personas:
          type: array
          items:
            $ref: "#/components/schemas/Persona"
      required: [id, name, slug, description, systemPrompt, defaultStyle, color, createdAt, personas]

    PersonaTypeInput:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
        defaultStyle:
          type: string
        color:
          type: string
      required: [name, slug, systemPrompt, defaultStyle, color]

    Persona:
      type: object
      properties:
        id:
          type: integer
        personaTypeId:
          type: ["integer", "null"]
        personaTypeName:
          type: ["string", "null"]
        name:
          type: string
        title:
          type: string
        photoUrl:
          type: ["string", "null"]
        additionalPrompt:
          type: string
        style:
          type: ["string", "null"]
        effectiveStyle:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, title, additionalPrompt, effectiveStyle, isActive, createdAt]

    PersonaInput:
      type: object
      properties:
        personaTypeId:
          type: ["integer", "null"]
        name:
          type: string
        title:
          type: string
        photoUrl:
          type: ["string", "null"]
        additionalPrompt:
          type: string
        style:
          type: ["string", "null"]
      required: [name, title, additionalPrompt]
